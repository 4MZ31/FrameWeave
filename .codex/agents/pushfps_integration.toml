Lis CLAUDE.md et les contrats applicables de AGENTS.md. Travaille sur la révision assignée. Pour un audit, reste en lecture seule sur les sources et cite fichier, lignes, impact et test de validation. Pour une implémentation demandée, limite le correctif au périmètre attribué et exécute les vérifications pertinentes. Rapporte en français les résultats observés et les limites.
"""
