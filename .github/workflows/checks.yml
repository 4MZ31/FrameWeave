# Fast checks that need no Windows build or proprietary SDK, on every push and pull request:
#  1. Translations: every Chinese source string has zh-TW / en / ja text and matching placeholders.
#  2. QML syntax: Qt 6.8.3 (the version PushFPS ships with) parses every QML file. A file that does not
#     parse would stop the app at startup, so this catches it before anyone runs a build.
#  3. QML lint (informational): qmllint findings for the PushFPS-specific QML files.
#  4. Protected features (tests/protected-features.json): every test that guards a feature still exists
#     and is still run by a workflow.
#  5. Every workflow file is valid YAML.
#  6. The interface tests' bridge object has no doubled name (scripts/checks/qml_fixture.py).
#  7. No settings row holds two controls of its own, which would be drawn on top of each other (scripts/checks/qml_rows.py).
#  8. The interface files the Linux and macOS preview shares read nothing its bridge object lacks (scripts/checks/portable_shared.py).
name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Release provenance (offline)
        run: bash tests/release/provenance.sh

      - name: Translations complete
        run: |
          out=$(python3 -B scripts/i18n/extract.py --check)
          echo "$out"
          echo "$out" | grep -qE "dropped=\[\] missing=\{('[^']+': 0(, )?)+\} placeholder problems=0"
          # --check never writes; also prove the catalog is exactly what extract.py would produce.
          cp i18n/catalog.json /tmp/catalog.json
          python3 -B scripts/i18n/extract.py > /dev/null
          if ! cmp -s i18n/catalog.json /tmp/catalog.json; then
            echo "::error file=i18n/catalog.json::catalog is not up to date; run python3 -B scripts/i18n/extract.py and commit"
            exit 1
          fi

      - name: Protected features still have their guards
        run: python3 -B scripts/checks/protected_features.py

      # The interface's pure JavaScript rules (qml/Veyra/*.js with no Qt in them), run with Node:
      # the only place they run on every push without a Windows build.
      - name: Interface rules (Node)
        run: |
          set -e
          for t in tests/js/*_test.js; do node "$t"; done

      # A workflow file that is not valid YAML never runs, and nothing else says so (a stray line broke
      # the screenshots workflow on 21 November 2026 and it simply did not start).
      - name: Workflow files parse
        run: |
          python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y -qq python3-yaml
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  yaml.safe_load(open(f, encoding='utf-8'))
              except Exception as e:
                  bad += 1
                  print(f"::error file={f}::{str(e)[:300]}")
          print('workflow files:', 'all parse' if not bad else f'{bad} broken')
          sys.exit(1 if bad else 0)
          PY

      # The one QML object every interface test shares (tests/qml/QuickSmokeTests.cpp). When it does not
      # load, no test runs, and the Windows build only says so forty minutes in.
      - name: The interface tests' bridge loads
        run: python3 -B scripts/checks/qml_fixture.py

      # A settings row lays out one control; two written straight into it are drawn on top of each
      # other (the update row's buttons, a user's screenshot of 22 November 2026).
      - name: No settings row has two controls on top of each other
        run: python3 -B scripts/checks/qml_rows.py

      # The Linux and macOS preview compiles a list of files straight from qml/Veyra and answers their
      # reads of the bridge with a small object of its own. A new read there works on Windows and is
      # undefined in the preview, which only its own workflow builds.
      - name: The files shared with the Linux and macOS preview read only what it answers
        run: python3 -B scripts/checks/portable_shared.py

      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in @(Get-ChildItem packaging, obs-plugin/packaging, obs-plugin/ci -Filter *.ps1)) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "::error file=$($f.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }
          Write-Host "All packaging scripts parse."

      - name: Install Qt 6.8.3 (QML tools only)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: QML syntax (qmlformat parses every file)
        run: |
          status=0
          for f in qml/Veyra/*.qml tests/qml/quick/tst_push_*.qml; do
            if ! qmlformat "$f" > /dev/null 2> /tmp/qmlformat.err; then
              echo "::error file=$f::QML does not parse"
              cat /tmp/qmlformat.err
              status=1
            fi
          done
          exit $status

      - name: QML lint for PushFPS files (informational)
        continue-on-error: true
        run: |
          qmllint -I qml --unqualified disable qml/Veyra/PushQuickSetup.qml qml/Veyra/HomePage.qml \
            qml/Veyra/VRow.qml qml/Veyra/TopDock.qml qml/Veyra/VAccordion.qml \
            qml/Veyra/PushPicture.qml qml/Veyra/PushSoundProfile.qml qml/Veyra/PushRecordingSaved.qml \
            qml/Veyra/PushHudDialog.qml qml/Veyra/VHelp.qml qml/Veyra/PushWordmark.qml qml/Veyra/PushLatencyGuideDialog.qml qml/Veyra/PushIntro.qml qml/Veyra/PushStreamDialog.qml
