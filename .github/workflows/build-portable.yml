# Builds and tests PushFPS for Linux and macOS (portable/, preview).
#
# The Linux / macOS build is PushFPS's own: Qt 6 (Quick, Multimedia, ShaderTools) for the window,
# capture cards and sound, and the core in portable/core for frame generation, duplicate removal,
# Frame Pacing Repair and Live HUD Lock. No vendor SDK is needed.
#
# What it checks, without hardware:
#   - the core tests in Release, with ASan + UBSan and with TSan (Linux), and with clang on macOS;
#   - the application's self-test on the built-in test picture (30 FPS on a 60 Hz signal, even and
#     uneven) and on a video file: rates, duplicate removal, output frame rate, motion in time;
#   - the GPU check: one generated frame drawn by the shader compared with the CPU reference
#     (Linux: Mesa llvmpipe under Xvfb; macOS: Metal);
#   - the packages: the Linux folder / AppImage started in a clean Ubuntu container, the macOS app
#     started from its bundle;
#   - screenshots of every page, published to the screenshots-portable branch.
name: build-portable

on:
  push:
    branches: [main, 'p/**']
    paths:
      - 'portable/**'
      - 'include/veyra/engine/PushPacingRepair.h'
      - 'include/veyra/engine/LiveStream.h'
      - 'src/engine/LiveStream.cpp'
      - 'tests/integration/LiveStreamTests.cpp'
      - 'tests/data/stream/**'
      - 'i18n/catalog.json'
      - '.github/workflows/build-portable.yml'
  pull_request:
    paths:
      - 'portable/**'
      - '.github/workflows/build-portable.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the Linux and macOS packages to this existing release (vX.Y.Z). Leave empty for a test build.'
        required: false
        default: ''

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  QT_VERSION: '6.8.3'
  LINUXDEPLOY_TAG: '1-alpha-20251107-1'
  LINUXDEPLOY_QT_TAG: '1-alpha-20250213-1'

concurrency:
  group: build-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang xvfb xauth ffmpeg patchelf \
            libgl1-mesa-dev libegl1 libgl1-mesa-dri libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libfontconfig1 libpulse0 libva2 libva-drm2 libva-x11-2 libvdpau1 fonts-dejavu-core

      - name: Core tests (Release)
        run: |
          cmake -S portable -B build-core -G Ninja -DPUSHFPS_PORTABLE_APP=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-core
          ./build-core/core/pushfps_portable_core_tests --bench

      - name: Core tests (ASan + UBSan, clang)
        run: |
          cmake -S portable -B build-asan -G Ninja -DPUSHFPS_PORTABLE_APP=OFF -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ \
            "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -O1"
          cmake --build build-asan
          ./build-asan/core/pushfps_portable_core_tests

      - name: Core tests (TSan)
        run: |
          cmake -S portable -B build-tsan -G Ninja -DPUSHFPS_PORTABLE_APP=OFF -DCMAKE_BUILD_TYPE=Debug "-DCMAKE_CXX_FLAGS=-fsanitize=thread -O1"
          cmake --build build-tsan
          TSAN_OPTIONS=halt_on_error=1 ./build-tsan/core/pushfps_portable_core_tests

      # Going live (engine/LiveStream.cpp, shared with the Windows build): two outputs at once over RTMP
      # and RTMPS to a local MediaMTX server, read back, server restart, a closed port, key redaction.
      - name: Going-live tests (local RTMP/RTMPS server)
        run: |
          sudo apt-get install -y --no-install-recommends libavformat-dev libavcodec-dev libavutil-dev pkg-config openssl
          g++ -std=c++20 -O2 -Wall -Wextra -Iinclude src/engine/LiveStream.cpp tests/integration/LiveStreamTests.cpp \
            $(pkg-config --cflags --libs libavformat libavcodec libavutil) -pthread -o build-core/live_stream_tests
          bash tests/data/stream/run-live-stream-tests.sh $PWD/build-core/live_stream_tests linux_amd64.tar.gz

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia qtshadertools
          cache: true

      - name: Build PushFPS
        run: |
          cmake -S portable -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPUSHFPS_PORTABLE_TESTS=OFF -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          ls -la build/app/PushFPS

      - name: Self-test (test picture, generated video, uneven pacing)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -e
          ./build/app/PushFPS --version
          ./build/app/PushFPS --list-devices
          ./build/app/PushFPS --selftest 6 --source testpattern --save build/selftest-frame.png
          ./build/app/PushFPS --selftest 6 --source testpattern --target 60
          ./build/app/PushFPS --selftest 8 --source testpattern-uneven --pacing --hud
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=30 -t 6 -c:v libx264 -pix_fmt yuv420p build/test.mp4
          ./build/app/PushFPS --selftest 6 --source file:build/test.mp4
          # Abuse: a camera that is not there, a missing file, an unknown source.
          set +e
          ./build/app/PushFPS --selftest 2 --source camera:7; test $? -eq 2
          ./build/app/PushFPS --selftest 3 --source file:build/missing.mp4; code=$?; test $code -eq 2 -o $code -eq 3
          ./build/app/PushFPS --selftest 2 --source nonsense; test $? -eq 1

      - name: GPU check (Mesa llvmpipe under Xvfb)
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          QSG_RHI_BACKEND: opengl
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./build/app/PushFPS --gpucheck --save build/gpucheck.png

      - name: Screenshots
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          QSG_RHI_BACKEND: opengl
        run: |
          mkdir -p shots
          for p in home settings player; do
            xvfb-run -a -s "-screen 0 1920x1080x24" ./build/app/PushFPS --screenshot shots/linux-$p.png --page $p --lang en
          done
          cp build/gpucheck.png shots/linux-gpucheck.png
          cp build/gpucheck-cpu.png shots/linux-gpucheck-cpu.png
          cp build/selftest-frame.png shots/linux-selftest-frame.png

      - name: Package (folder and AppImage)
        run: |
          set -e
          version=$(grep -oP 'project\(pushfps_portable VERSION \K[0-9.]+' portable/CMakeLists.txt)
          # Packages attached to a release carry the release's number, like the Windows zip.
          tag="$RELEASE_TAG"; if [ -n "$tag" ]; then version=${tag#v}; fi
          echo "PORTABLE_VERSION=$version" >> $GITHUB_ENV
          DESTDIR=$PWD/AppDir cmake --install build
          mkdir -p AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp portable/app/packaging/pushfps.desktop AppDir/usr/share/applications/
          python3 -c "from PIL import Image" 2>/dev/null || pip install --quiet pillow
          python3 -c "from PIL import Image; Image.open('portable/app/qml/icon.png').resize((256,256)).save('AppDir/usr/share/icons/hicolor/256x256/apps/pushfps.png')"
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/$LINUXDEPLOY_TAG/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/$LINUXDEPLOY_QT_TAG/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QML_SOURCES_PATHS=$PWD/portable/app/qml
          export LDAI_OUTPUT=PushFPS-$version-linux-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage \
            --desktop-file AppDir/usr/share/applications/pushfps.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/pushfps.png
          # The same folder as a portable download: unpack, run ./PushFPS (AppRun).
          cp -r AppDir PushFPS-$version-linux-x86_64
          cp LICENSE PushFPS-$version-linux-x86_64/LICENSE.txt
          cp portable/app/packaging/README-linux.txt PushFPS-$version-linux-x86_64/README.txt
          ln -sf AppRun PushFPS-$version-linux-x86_64/PushFPS
          tar -czf PushFPS-$version-linux-x86_64.tar.gz PushFPS-$version-linux-x86_64
          ls -la *.AppImage *.tar.gz

      - name: Package test in a clean Ubuntu 24.04 container
        run: |
          docker run --rm -v $PWD:/w -w /w ubuntu:24.04 bash -c '
            set -e
            apt-get update -qq && apt-get install -y -qq --no-install-recommends libgl1 libopengl0 libegl1 libfontconfig1 libxkbcommon0 libglib2.0-0t64 libdbus-1-3 >/dev/null
            mkdir -p /tmp/t && tar -xzf PushFPS-'$PORTABLE_VERSION'-linux-x86_64.tar.gz -C /tmp/t
            cd /tmp/t/PushFPS-'$PORTABLE_VERSION'-linux-x86_64
            QT_QPA_PLATFORM=offscreen ./PushFPS --selftest 5 --source testpattern
            touch portable.txt
            QT_QPA_PLATFORM=offscreen ./PushFPS --version'

      - name: Publish screenshots
        if: github.event_name != 'pull_request'
        run: |
          set -e
          git config --global user.name github-actions
          git config --global user.email github-actions@users.noreply.github.com
          git clone --depth 1 --branch screenshots-portable https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} pub 2>/dev/null || {
            mkdir pub && cd pub && git init -q -b screenshots-portable && git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} && cd ..; }
          cp shots/*.png pub/
          cd pub
          git add *.png
          git commit -q -m "Linux screenshots from ${GITHUB_SHA::8}" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin screenshots-portable 2>/dev/null; git push -q origin HEAD:screenshots-portable && break; sleep 5; done

      - name: Attach to release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum PushFPS-$PORTABLE_VERSION-linux-x86_64.tar.gz > PushFPS-$PORTABLE_VERSION-linux-x86_64.tar.gz.sha256
          sha256sum PushFPS-$PORTABLE_VERSION-linux-x86_64.AppImage > PushFPS-$PORTABLE_VERSION-linux-x86_64.AppImage.sha256
          gh release upload "$RELEASE_TAG" --clobber \
            PushFPS-$PORTABLE_VERSION-linux-x86_64.tar.gz PushFPS-$PORTABLE_VERSION-linux-x86_64.tar.gz.sha256 \
            PushFPS-$PORTABLE_VERSION-linux-x86_64.AppImage PushFPS-$PORTABLE_VERSION-linux-x86_64.AppImage.sha256

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Core tests (clang, ASan + UBSan)
        run: |
          cmake -S portable -B build-core -DPUSHFPS_PORTABLE_APP=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-core -j4
          ./build-core/core/pushfps_portable_core_tests --bench
          cmake -S portable -B build-asan -DPUSHFPS_PORTABLE_APP=OFF -DCMAKE_BUILD_TYPE=Debug \
            "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -O1"
          cmake --build build-asan -j4
          ./build-asan/core/pushfps_portable_core_tests

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia qtshadertools
          cache: true

      - name: Build PushFPS (Apple Silicon and Intel)
        run: |
          cmake -S portable -B build -DCMAKE_BUILD_TYPE=Release -DPUSHFPS_PORTABLE_TESTS=OFF "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build -j4
          lipo -info build/app/PushFPS.app/Contents/MacOS/PushFPS

      - name: Self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -e
          app=build/app/PushFPS.app/Contents/MacOS/PushFPS
          $app --version
          $app --list-devices
          # Shared macOS runners sometimes starve the process for seconds (the 60 Hz test picture then arrives
          # at 40 Hz and the rate check fails for reasons outside PushFPS). A real fault fails twice in a row.
          twice() { "$@" || { echo "::warning::retrying once: $*"; "$@"; }; }
          twice $app --selftest 6 --source testpattern
          twice $app --selftest 8 --source testpattern-uneven --pacing --hud
          set +e
          $app --selftest 2 --source camera:7; test $? -eq 2

      - name: GPU check (Metal)
        continue-on-error: true
        run: build/app/PushFPS.app/Contents/MacOS/PushFPS --gpucheck --save build/gpucheck.png

      - name: Package (app bundle, zip)
        run: |
          set -e
          version=$(sed -nE 's/.*project\(pushfps_portable VERSION ([0-9.]+).*/\1/p' portable/CMakeLists.txt)
          tag="$RELEASE_TAG"; if [ -n "$tag" ]; then version=${tag#v}; fi
          echo "PORTABLE_VERSION=$version" >> $GITHUB_ENV
          python3 -m pip install --quiet --break-system-packages pillow 2>/dev/null || python3 -m pip install --quiet pillow
          mkdir -p build/app/PushFPS.app/Contents/Resources
          python3 -c "from PIL import Image; Image.open('portable/app/qml/icon.png').convert('RGBA').save('build/app/PushFPS.app/Contents/Resources/PushFPS.icns', sizes=[(16,16),(32,32),(64,64),(128,128),(256,256),(512,512),(1024,1024)])"
          macdeployqt build/app/PushFPS.app -qmldir=portable/app/qml -always-overwrite
          # Ad-hoc signature (required to run on Apple Silicon); not notarised.
          codesign --force --deep --sign - build/app/PushFPS.app
          codesign --verify --deep --strict build/app/PushFPS.app
          mkdir -p dist
          ditto build/app/PushFPS.app dist/PushFPS.app
          cp LICENSE dist/LICENSE.txt
          cp portable/app/packaging/README-macos.txt dist/README.txt
          ditto -c -k --sequesterRsrc dist PushFPS-$version-macos-universal.zip
          ls -la *.zip

      - name: Package test (deployed bundle)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -e
          mkdir -p /tmp/t && ditto -x -k PushFPS-$PORTABLE_VERSION-macos-universal.zip /tmp/t
          # Make sure nothing still points at the Qt install on this machine.
          if [ -n "$QT_ROOT_DIR" ]; then ! otool -L /tmp/t/PushFPS.app/Contents/MacOS/PushFPS | grep -q "$QT_ROOT_DIR"; fi
          # This checks the packaged bundle (Qt frameworks, plugins, shaders, QML), not speed: the 120 FPS
          # self-test already ran on the build. Shared macOS runners sometimes stall for a moment under load,
          # so the bundle is checked at 60 FPS, where a stall cannot decide the result.
          /tmp/t/PushFPS.app/Contents/MacOS/PushFPS --selftest 5 --source testpattern --target 60 || {
            echo "::warning::retrying once after a runner stall"
            /tmp/t/PushFPS.app/Contents/MacOS/PushFPS --selftest 5 --source testpattern --target 60; }

      - name: Screenshots
        continue-on-error: true
        run: |
          mkdir -p shots
          for p in home settings player; do
            build/app/PushFPS.app/Contents/MacOS/PushFPS --screenshot shots/macos-$p.png --page $p --lang en || true
          done
          cp build/gpucheck.png shots/macos-gpucheck.png 2>/dev/null || true

      - name: Publish screenshots
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          set -e
          ls shots/*.png >/dev/null 2>&1 || exit 0
          git config --global user.name github-actions
          git config --global user.email github-actions@users.noreply.github.com
          for i in 1 2 3 4 5; do
            rm -rf pub
            git clone --depth 1 --branch screenshots-portable https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} pub 2>/dev/null || { sleep 20; continue; }
            cp shots/*.png pub/
            cd pub
            git add *.png
            git commit -q -m "macOS screenshots from ${GITHUB_SHA::8}" || exit 0
            git push -q origin HEAD:screenshots-portable && exit 0
            cd ..
            sleep 10
          done

      - name: Attach to release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shasum -a 256 PushFPS-$PORTABLE_VERSION-macos-universal.zip > PushFPS-$PORTABLE_VERSION-macos-universal.zip.sha256
          gh release upload "$RELEASE_TAG" --clobber PushFPS-$PORTABLE_VERSION-macos-universal.zip PushFPS-$PORTABLE_VERSION-macos-universal.zip.sha256
